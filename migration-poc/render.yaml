services:
  - type: web
    name: job-tracker-migration-poc
    runtime: docker
    plan: free
    region: singapore
    branch: codex/migration-poc-demo
    rootDir: migration-poc
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: POC_ACCESS_TOKEN
        generateValue: true
      - key: POC_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POC_WRITE_DATABASE_URL
        sync: false
      - key: POC_WRITE_ENABLED
        value: "false"
      - key: POC_SHARED_DATABASE_WRITE_ENABLED
        value: "false"
      - key: POC_PERSISTENT_SESSION_ENABLED
        value: "true"
      - key: POC_SESSION_DAYS
        value: "7"
      - key: POC_ENCRYPTION_KEY
        sync: false
      - key: POC_AI_CALLS_ENABLED
        value: "false"
      - key: POC_ADMIN_ENABLED
        value: "false"
