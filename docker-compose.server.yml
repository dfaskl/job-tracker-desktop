# Production SQLite deployment; requires Docker Compose >= 2.30.
# Secrets are generated locally on the server from its existing .env.
services:
  app:
    image: ${CAREERFLOW_IMAGE:?Set CAREERFLOW_IMAGE to the loaded image tag}
    pull_policy: never
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${APP_PORT:-18080}:8080"
    env_file:
      - path: .env.docker
        format: raw
    environment:
      PORT: "8080"
      APP_PORT: "8080"
      APP_DATABASE_URL: jdbc:sqlite:/app/data/jobtracker.db
      SQLITE_BACKUP_DIR: /app/backups/sqlite
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./backups
        target: /app/backups
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
