services:
  - type: web
    name: job-tracker-web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: SESSION_DAYS
        value: "7"
      - key: AI_CALLS_ENABLED
        value: "true"
      - key: AI_ALLOWED_HOSTS
        value: api.deepseek.com,api.openai.com
      - key: REGISTRATION_CODE
        sync: false
