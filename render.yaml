services:
  - type: web
    name: job-tracker-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_REGISTRATION
        value: true
      - key: AI_ALLOWED_HOSTS
        value: api.deepseek.com,api.openai.com
      - key: REGISTRATION_CODE
        sync: false

databases:
  - name: job-tracker-db
    plan: basic-256mb
    region: singapore
    ipAllowList: []
    databaseName: job_tracker
    user: job_tracker
