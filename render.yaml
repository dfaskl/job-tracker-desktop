services:
  - type: web
    name: job-tracker-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOW_REGISTRATION
        value: true
      - key: AI_ALLOWED_HOSTS
        value: api.deepseek.com,api.openai.com
      - key: REGISTRATION_CODE
        sync: false
