services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jobtracker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_DATABASE_URL: postgresql://jobtracker:${POSTGRES_PASSWORD}@database:5432/jobtracker
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      AI_CALLS_ENABLED: ${AI_CALLS_ENABLED:-true}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-api.openai.com,api.deepseek.com}

volumes:
  jobtracker_data: