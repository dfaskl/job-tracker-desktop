name: CI

on:
  push:
    branches: [main, "codex/migration-poc-demo"]
    paths:
      - "migration-poc/**"
      - ".github/workflows/ci.yml"
      - "render.yaml"
  pull_request:
    branches: [main]
    paths:
      - "migration-poc/**"
      - ".github/workflows/ci.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: migration-poc/frontend/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build current Vue and Spring Boot application
        run: mvn -B -f migration-poc/backend/pom.xml clean package