name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/migration-poc-demo"]
    paths:
      - "migration-poc/**"
      - ".github/workflows/ci.yml"
      - "render.yaml"
  pull_request:
    branches: [main]
    paths:
      - "migration-poc/**"
      - ".github/workflows/ci.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: migration-poc/frontend/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build current Vue and Spring Boot application
        run: mvn -B -f migration-poc/backend/pom.xml clean package
      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-jar
          path: migration-poc/backend/target/job-tracker.jar
          if-no-files-found: error
          retention-days: 14
      - name: Assemble self-contained Linux x64 package
        shell: bash
        run: |
          set -Eeuo pipefail
          package_dir="$RUNNER_TEMP/job-tracker-package"
          package_root="$package_dir/job-tracker"
          mkdir -p "$package_root/runtime"

          cp migration-poc/backend/target/job-tracker.jar "$package_root/job-tracker.jar"
          cp migration-poc/deploy/self-hosted/env.example "$package_root/env.example"
          cp migration-poc/deploy/self-hosted/start.sh "$package_root/start.sh"
          cp migration-poc/deploy/self-hosted/stop.sh "$package_root/stop.sh"
          cp migration-poc/deploy/self-hosted/status.sh "$package_root/status.sh"
          cp migration-poc/deploy/self-hosted/migrate-to-sqlite.sh "$package_root/migrate-to-sqlite.sh"

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$package_dir/temurin-jre21.tar.gz" \
            "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse"
          tar -tzf "$package_dir/temurin-jre21.tar.gz" >/dev/null
          tar -xzf "$package_dir/temurin-jre21.tar.gz" \
            --directory "$package_root/runtime" \
            --strip-components=1

          chmod +x "$package_root/start.sh" "$package_root/stop.sh" "$package_root/status.sh" "$package_root/migrate-to-sqlite.sh"
          mkdir -p migration-poc/dist
          tar -czf migration-poc/dist/job-tracker-linux-x64.tar.gz \
            --directory "$package_dir" job-tracker
          cd migration-poc/dist
          sha256sum job-tracker-linux-x64.tar.gz > job-tracker-linux-x64.tar.gz.sha256
      - name: Upload self-contained Linux x64 package
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-linux-x64
          path: |
            migration-poc/dist/job-tracker-linux-x64.tar.gz
            migration-poc/dist/job-tracker-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
